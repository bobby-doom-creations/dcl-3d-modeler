[package]
name = "dcl-3d-modeler"
version = "0.1.0"
edition = "2021"
description = "Doom Creations Lab — Cross-platform 3D modeling application"
authors = ["Bobby Sulz <bobby@doomcreationslab.com>"]
rust-version = "1.75"

[lib]
name = "dcl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dcl_main"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mesh manipulation
halfedge = "0.3"
boolmesh = "0.2"
glam = "0.32"

# File I/O
lib3mf = "0.1"
gltf = "1.1"
wavefront_obj = "0.13"
image = "0.25"

# Process management (for Python subprocesses)
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"
